name: CI
on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request: { branches: [main] }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - run: dotnet pack ScienceLogic.Em7.Api/ScienceLogic.Em7.Api.csproj --no-build --configuration Release --output ./artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
  # Test coverage, uploaded to Codacy (OPS-157454).
  #
  # pdl-public, not a GitHub-hosted runner and not pdl-prod-cluster. This repository is public, and
  # GitHub disallows self-hosted runners for public repositories unless the runner group opts in,
  # because a fork pull request is untrusted code from a stranger. pdl-public is the hardened scale
  # set that may: no dind, no privileged container, no hostPath, nothing shared between jobs.
  coverage:
    runs-on: [pdl-public]
    env:
      # The actions-runner image does not offer the Node version several actions request by
      # default; without this they fail before their first step runs.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 } # avoid a shallow clone so nbgv can do its work.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        # The runner user cannot write /usr/share/dotnet, so install the SDK somewhere it can.
        env: { DOTNET_INSTALL_DIR: '${{ runner.temp }}/dotnet' }
        with: { dotnet-version: '10.0.x' }
      - name: Build tests
        run: dotnet build ScienceLogic.Em7.Api.Test/ScienceLogic.Em7.Api.Test.csproj --configuration Debug
      # The test project is a Microsoft.Testing.Platform application, so coverage is collected by
      # running it directly (Microsoft.Testing.Extensions.CodeCoverage) rather than through
      # `dotnet test`. On Linux the host has no .exe extension. Every test here is an offline unit
      # test against a stubbed HttpMessageHandler, so none needs excluding.
      - name: Run tests with coverage
        run: >-
          ./ScienceLogic.Em7.Api.Test/bin/Debug/net10.0/ScienceLogic.Em7.Api.Test
          --coverage
          --coverage-settings coverage.config
          --coverage-output-format cobertura
          --coverage-output coverage.cobertura.xml
      # continue-on-error: a Codacy outage must not turn a passing test run red. The trade-off is
      # that an expired project token fails silently, so check the log for
      # "Coverage received successfully".
      - name: Upload coverage to Codacy
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ScienceLogic.Em7.Api.Test/bin/Debug/net10.0/TestResults/coverage.cobertura.xml
      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ScienceLogic.Em7.Api.Test/bin/Debug/net10.0/TestResults/coverage.cobertura.xml
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: nuget, path: ./artifacts }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - uses: NuGet/login@v1
        id: login
        with: { user: david_n_m_bond }
      - run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
